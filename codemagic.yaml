workflows:
  ios-build:
    name: Build iOS App
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: xcodegen generate
      - name: Build IPA
        script: |
          xcodebuild build \
            -project BurmaldaApp.xcodeproj \
            -scheme BurmaldaApp \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/Build/Products/Debug-iphoneos/*.app
