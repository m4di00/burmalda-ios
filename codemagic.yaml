workflows:
  ios-build:
    name: Build iOS App
    environment:
      xcode: latest
    scripts:
      - name: Build IPA
        script: |
          xcodebuild build \
            -project BurmaldaApp.xcodeproj \
            -scheme BurmaldaApp \
            -destination 'generic/platform=iOS' \
            -archivePath build/BurmaldaApp.xcarchive \
            archive
    artifacts:
      - build/BurmaldaApp.xcarchive/Products/Applications/*.app
